name: "Zemlianika"
x-backend-build: &backend_build
  context: ./services/backend
  dockerfile: Dockerfile

services:
  db:
    container_name: zemlianika_db
    image: postgres:19
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  migrate:
    build: *backend_build
    command: ["migrate"]
    container_name: zemlianika_migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  backend:
    build: *backend_build
    container_name: zemlianika_backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    init: true
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
    container_name: zemlianika_frontend
    init: true
volumes:
  postgres_data:
